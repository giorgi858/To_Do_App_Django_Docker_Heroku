services:

  web:
    build: .
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn server.wsgi:application --bind 0.0.0.0:8000
      "
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    depends_on:
      - db
      - redis


  db:
    image: postgres:14
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env.prod


  redis:
    image: redis:7
    restart: always


  celery:
    build: .
    command: celery -A server worker -l info
    volumes:
      - .:/code
    env_file:
      - .env.prod
    depends_on:
      - web
      - redis
      - db


  celery-beat:
    build: .
    command: celery -A server beat -l info
    volumes:
      - .:/code
    env_file:
      - .env.prod
    depends_on:
      - web
      - redis
      - db


volumes:
  postgres_data: