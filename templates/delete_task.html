{% extends "base.html" %}
{% load static %}

{% block title %}Delete Task{% endblock title %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-6 col-lg-5">

        <div class="card border-0 shadow rounded-4">
            <div class="card-body p-5 text-center">

                <h4 class="fw-semibold mb-3 text-danger">
                    Delete Task
                </h4>
                <p class="mb-4">
                    Are you sure you want to delete the task: 
                    <strong>{{ object.task }}</strong>?
                </p>

                <form method="POST" class="d-flex justify-content-center gap-3">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-lg rounded-pill px-4">
                        Delete
                    </button>
                    <a href="{% url 'todo' %}" class="btn btn-outline-success btn-lg rounded-pill px-4">
                        Cancel
                    </a>
                </form>

            </div>
        </div>

    </div>
</div>
{% endblock %}
