{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}
{% load i18n %}

{% block title %}{% trans "Log Out" %}{% endblock title %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-6 col-lg-5">

        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-5 text-center">

                <h3 class="fw-semibold text-danger mb-4">
                    {% trans "Are you sure you want to log out?" %}
                </h3>

                <form method="POST" action="{% url 'account_logout' %}" class="d-grid gap-3">
                    {% csrf_token %}
                    {{ form|crispy }}

                    <button type="submit" class="btn btn-danger btn-lg rounded-pill">
                        {% trans "Log Out" %}
                    </button>

                    <a href="{% url 'home' %}" class="btn btn-outline-success btn-lg rounded-pill">
                        {% trans "Cancel" %}
                    </a>
                </form>

            </div>
        </div>

    </div>
</div>
{% endblock %}
