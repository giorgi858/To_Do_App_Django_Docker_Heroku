{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Change Username{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 500px; min-height: 50vh;">
  <h2>Change Username</h2>

  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button class="btn btn-primary w-100 mt-3">Update</button>
  </form>
</div>
{% endblock %}
