{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}


{% block title %} Sign Up{% endblock title %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center my-5" style="min-height: 70vh;">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-4 text-center">

    <h2>Sign Up</h2>
    <form method="POST">
    {% csrf_token %}
    {{ form|crispy }}
    <button class="btn btn-outline-success" type="submit">Sign Up</button>
    <br/><br/>
    <p>Don't Have an Accout? <a type="button" class="btn btn-sm btn-outline-success"  href="{% url 'account_login' %}"> Login</a></p>
    </form>
            </div>
        </div>
    </div>
</div>


{% endblock %}
